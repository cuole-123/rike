<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FAF8F4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>日课</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="icons/favicon-64.png">
<style>
:root{
  --paper:#FAF8F4; --card:#FFFFFF; --ink:#1A1917; --ink2:#5E5A52; --ink3:#9A948A;
  --line:#E7E2D8; --line2:#F1EDE5; --seal:#B23A2E; --seal2:#7E241A; --teal:#3F6B65;
  --gold:#8A7A5C;
  --serif:"Source Han Serif SC","Noto Serif SC","Songti SC",SimSun,Georgia,serif;
  --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{background:var(--paper);color:var(--ink);font:15px/1.7 var(--sans);-webkit-font-smoothing:antialiased}
::selection{background:#F3E3DF}
.app{max-width:560px;margin:0 auto;min-height:100vh;background:var(--paper);padding-bottom:calc(74px + var(--safe-b))}
@media(min-width:600px){body{background:#F2EFE8}.app{box-shadow:0 0 0 1px var(--line),0 18px 40px rgba(26,25,23,.06)}}

.top{display:flex;align-items:center;gap:10px;padding:16px 20px 13px;border-bottom:1px solid var(--line);
  position:sticky;top:0;background:rgba(250,248,244,.95);backdrop-filter:blur(12px);z-index:20}
.logo{font:600 17px/1 var(--serif);letter-spacing:.3em}
.top .sp{flex:1}
.top .lvmeta{display:flex;flex-direction:column;line-height:1.25;text-align:right}
.top .lvmeta b{font-size:11px;letter-spacing:.08em;color:var(--ink2)}
.top .lvmeta i{font-style:normal;font-size:9.5px;color:var(--ink3)}
.seal-mini{width:34px;height:34px;border:1.4px solid var(--seal);border-radius:2px;position:relative;
  display:grid;place-items:center;font:600 12.5px/1 var(--serif);color:var(--seal);background:#fff}
.seal-mini::after{content:'';position:absolute;inset:3px;border:1px solid rgba(178,58,46,.3);border-radius:1px}

/* 诗句 */
.poem{text-align:center;padding:16px 26px 14px;font:400 12.5px/1.9 var(--serif);color:var(--ink3);letter-spacing:.06em}
.poem span{display:block;font-size:10px;letter-spacing:.16em;margin-top:3px;color:#B3ACA0}

/* 日期条 */
.daynav{display:flex;align-items:center;justify-content:space-between;padding:6px 20px 16px;border-bottom:1px solid var(--line2)}
.daynav .arrow{width:36px;height:36px;border:1px solid var(--line);background:transparent;border-radius:50%;
  font:15px/1 var(--serif);color:var(--ink2)}
.daynav .arrow:disabled{opacity:.25}
.daynav .d{text-align:center;flex:1}
.daynav .dow{font-size:9.5px;letter-spacing:.28em;color:var(--ink3)}
.daynav .dnum{font:600 20px/1.35 var(--serif);letter-spacing:.05em;margin-top:2px}
.daynav .dyr{font-size:10px;letter-spacing:.16em;color:var(--ink3)}

.block{padding:22px 20px 6px}
.seclbl{display:flex;align-items:center;gap:8px;font:600 10.5px/1 var(--sans);letter-spacing:.24em;
  color:var(--ink3);margin-bottom:13px}
.seclbl::after{content:'';flex:1;height:1px;background:var(--line2)}
.metaline{font-size:11px;color:var(--ink3);letter-spacing:.04em;margin:-4px 0 14px}

ul.tasks{list-style:none;margin:0;padding:0}
li.task{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--line2);transition:opacity .2s}
li.task:last-child{border-bottom:0}
li.task.done{opacity:.38}
li.task.done .ref{text-decoration:line-through}
.ck{display:none}
.msel{width:22px;height:22px;flex:0 0 22px;border:1px solid var(--line);border-radius:3px;display:grid;place-items:center;
  font-size:12px;color:var(--seal);margin-top:2px;background:#fff}
li.task.sel{background:#FCF6F4}
.task .body{flex:1;min-width:0}
.chips{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:5px}
.chip{font-size:9.5px;padding:1px 7px;border:1px solid var(--line);border-radius:2px;color:var(--ink2);letter-spacing:.1em}
.chip.sf{color:var(--seal);border-color:#E4C9C2}
.chip.gd{color:var(--teal);border-color:#C6D6D2}
.chip.en{color:#7A6A4F;border-color:#DCD2BC}
.stars{font-size:9.5px;color:#C29284;letter-spacing:1px}
.ref{font-size:14px;line-height:1.6}
.tip{font-size:11px;color:var(--ink3);margin-top:4px;line-height:1.55}
.meter{display:flex;align-items:center;gap:7px;margin-top:7px;font-size:10.5px;color:var(--ink3)}
.meter input{width:50px;border:0;border-bottom:1px solid var(--line);background:transparent;
  font:13px/1.4 var(--serif);text-align:center;color:var(--ink);font-variant-numeric:tabular-nums}
.meter input:focus{outline:0;border-bottom-color:var(--seal)}

.sum{display:flex;gap:26px;padding:16px 0 2px;border-top:1px solid var(--line);margin-top:6px}
.sum .k{font-size:9px;letter-spacing:.16em;color:var(--ink3)}
.sum .v{font:600 17px/1.3 var(--serif);font-variant-numeric:tabular-nums;margin-top:2px}
.sum .v small{font:400 9px var(--sans);color:var(--ink3)}

.stampbtn{width:100%;margin-top:20px;padding:16px;border:1px solid var(--ink);background:var(--ink);
  color:var(--paper);border-radius:3px;font:600 13px/1 var(--sans);letter-spacing:.34em;text-indent:.34em}
.stampbtn:active{transform:scale(.985)}
.ghostbtn{width:100%;margin-top:10px;padding:13px;border:1px solid var(--line);background:transparent;
  color:var(--ink2);border-radius:3px;font:600 12.5px/1 var(--sans);letter-spacing:.28em;text-indent:.28em}

/* 加餐 / 替换 */
.acts{display:flex;gap:14px;align-items:center;margin-top:7px}
.linkbtn{border:0;background:none;padding:2px 0;font:500 10.5px var(--sans);letter-spacing:.1em;
  color:var(--ink3);border-bottom:1px solid transparent;text-decoration:none}
.linkbtn:active{color:var(--seal)}
.linkbtn.warn{color:var(--seal)}
.addbar{display:flex;gap:10px;margin-top:16px;padding-top:14px;border-top:1px dashed var(--line)}
.addbar button{flex:1;padding:11px;border:1px solid var(--line);background:transparent;border-radius:3px;
  font:500 11.5px var(--sans);letter-spacing:.14em;color:var(--ink2)}
.addbar button:active{background:#F4F0E9}

.extras{margin-top:14px;border-top:1px solid var(--line2);padding-top:12px}
.extras .eh{font-size:9px;letter-spacing:.2em;color:var(--ink3);margin-bottom:8px}
.extras .ei{display:flex;gap:8px;align-items:baseline;font-size:12.5px;color:var(--ink2);padding:4px 0}
.extras .ei b{font-weight:500;color:var(--ink)}
.extras .ei em{font-style:normal;font-size:10px;color:var(--ink3);letter-spacing:.06em}
.extras .ei .rm{margin-left:auto;color:var(--ink3);font-size:14px;padding:0 4px}
.task{position:relative;touch-action:pan-y;background:var(--paper);will-change:transform}
.task.replaced{opacity:.72}
.swhint{font:300 20px/1 var(--serif);color:#D6CFC2;align-self:center;margin-left:2px}
.swact{position:absolute;right:18px;top:50%;transform:translateY(-50%);opacity:0;
  font:600 11px var(--sans);letter-spacing:.24em;color:var(--seal);pointer-events:none;transition:opacity .12s}
button:active{transform:scale(.97);transition:transform .08s}
.bn{display:flex;gap:11px;padding:12px 0;border-bottom:1px solid var(--line2);cursor:pointer}
.bn:last-child{border-bottom:0}
.bn.on .bref{color:var(--ink3);text-decoration:line-through}
.bmark{width:19px;height:19px;flex:0 0 19px;display:grid;place-items:center;font-size:12px;
  color:#C29284;border:1px dashed #E0D6C8;border-radius:50%;margin-top:1px;transition:.15s}
.bn.on .bmark{color:var(--seal);border-color:#E4C9C2;border-style:solid;background:#FCF6F4}
.bbody{flex:1;min-width:0}
.bref{font-size:12.5px;line-height:1.65;color:var(--ink2)}
.bmin{font-size:9.5px;color:var(--ink3);margin-top:2px;letter-spacing:.06em}
.donebar{display:flex;align-items:center;gap:10px;margin-top:14px;padding:11px 13px;background:#F4F1EA;
  border-radius:3px;font-size:11.5px;color:var(--ink2)}
.donebar b{color:var(--seal);font-weight:600}
.donebar button{margin-left:auto;border:0;background:none;color:var(--ink3);font-size:10.5px;
  letter-spacing:.1em;text-decoration:underline;text-underline-offset:3px}

/* 完成弹层 */
.modal{position:fixed;inset:0;z-index:120;display:flex;align-items:flex-end;background:rgba(26,25,23,.42);
  backdrop-filter:blur(2px)}
.modal.hidden{display:none}
.msheet{width:100%;max-width:560px;margin:0 auto;background:var(--paper);border-radius:14px 14px 0 0;
  padding:22px 22px calc(24px + var(--safe-b));animation:up .26s cubic-bezier(.2,.9,.3,1) both}
@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
.mtitle{font:600 11px/1 var(--sans);letter-spacing:.24em;color:var(--ink3);margin-bottom:10px}
.mref{font:500 15px/1.6 var(--serif);color:var(--ink);margin-bottom:18px}
.mrow{display:flex;align-items:baseline;gap:10px;border-bottom:1px solid var(--line);padding-bottom:8px}
.mrow input{flex:1;border:0;background:transparent;font:600 30px/1 var(--serif);color:var(--ink);
  font-variant-numeric:tabular-nums;width:100%}
.mrow input:focus{outline:0}
.mrow span{font-size:11px;color:var(--ink3);letter-spacing:.1em}
.mbtns{display:flex;gap:10px;margin-top:20px}
.mbtns button{flex:1;padding:14px;border-radius:3px;font:600 13px var(--sans);letter-spacing:.2em}
.mok{background:var(--ink);color:var(--paper);border:1px solid var(--ink)}
.mno{background:transparent;color:var(--ink3);border:1px solid var(--line)}

/* 鼓励浮层 */
.cheer{position:fixed;inset:0;z-index:110;display:grid;place-items:center;pointer-events:none;
  background:rgba(250,248,244,0);opacity:0;transition:opacity .3s}
.cheer.on{opacity:1;background:rgba(250,248,244,.93)}
.cheer .c1{font:600 26px/1.4 var(--serif);color:var(--seal);letter-spacing:.08em;text-align:center}
.cheer .c2{font:400 17px/2 var(--serif);color:var(--ink);margin-top:18px;text-align:center;letter-spacing:.06em}
.cheer .c3{font:400 10.5px var(--sans);color:var(--ink3);margin-top:6px;text-align:center;letter-spacing:.18em}

/* 拿起纸片 */
.task.dragging{box-shadow:0 10px 24px rgba(26,25,23,.10);border-radius:3px;background:#FBF8F1}
/* 燃成灰 */
.task.burning{animation:burnfade .3s ease-out forwards;pointer-events:none}
@keyframes burnfade{
  0%{opacity:1;filter:blur(0)}
  55%{opacity:.45;filter:blur(.5px)}
  100%{opacity:0;filter:blur(1.2px)}
}
#ashcanvas{position:fixed;inset:0;z-index:115;pointer-events:none;display:none}
/* 塌陷 */
.task.collapsing{overflow:hidden;transition:height .28s ease,opacity .28s ease,padding .28s ease;
  padding-top:0!important;padding-bottom:0!important;opacity:0}
.cheer.on .c1{animation:pop .5s cubic-bezier(.2,.9,.3,1.3) both}

/* 日报模块 */
.daily-item{padding:17px 0;border-bottom:1px solid var(--line2);cursor:pointer}
.daily-item:last-child{border-bottom:0}
.daily-item:active{background:#FCFAF6}
.daily-meta{display:flex;gap:8px;align-items:center;font-size:9.5px;letter-spacing:.12em;color:var(--ink3);margin-bottom:6px}
.daily-issue{border:1px solid #E4C9C2;color:var(--seal);padding:1px 6px;border-radius:2px;font-size:9px}
.daily-title{font:600 14.5px/1.6 var(--serif);color:var(--ink);letter-spacing:.01em}
.daily-ex{font-size:11px;color:var(--ink3);line-height:1.85;margin-top:5px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.reader h2{font:600 19px/1.5 var(--serif);margin:0 0 4px;color:var(--ink)}
.reader h3{font:600 13.5px/1.6 var(--serif);color:var(--seal);margin:20px 0 7px;letter-spacing:.04em}
.reader p{font-size:13px;line-height:2;color:var(--ink2);margin:0 0 11px;text-align:justify}
.reader strong{color:var(--ink);font-weight:600}
.backbar{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line2);margin-bottom:16px}
.backbar button{border:0;background:none;font:500 12px var(--sans);color:var(--ink3);letter-spacing:.08em;padding:0}
.backbar .bd{font-size:10px;color:var(--ink3);letter-spacing:.1em;margin-left:auto}

/* 统一编辑面板 */
.seg{display:flex;background:#EFEBE2;border-radius:3px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;padding:9px;border-radius:2px;
  font:500 12px var(--sans);letter-spacing:.14em;color:var(--ink3)}
.seg button.on{background:var(--paper);color:var(--ink);box-shadow:0 1px 2px rgba(26,25,23,.07)}
.chiprow{display:flex;gap:8px;margin-top:6px}
.chipbtn{flex:1;border:1px solid var(--line);background:transparent;padding:9px;border-radius:3px;
  font:500 12px var(--sans);letter-spacing:.1em;color:var(--ink3)}
.chipbtn.on{border-color:var(--seal);color:var(--seal);background:#FCF6F4}
.txt{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;
  font:13.5px var(--sans);color:var(--ink);padding:8px 0;margin-top:8px}
.txt:focus{outline:0;border-bottom-color:var(--seal)}
.swbox{display:flex;align-items:center;gap:10px;margin-top:18px;font-size:12px;color:var(--ink2)}
.swbox input{width:17px;height:17px;accent-color:var(--seal)}
.fl{font-size:9px;letter-spacing:.16em;color:var(--ink3)}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
.repdot{width:19px;height:19px;flex:0 0 19px;margin-top:2px;display:grid;place-items:center;
  font-size:11px;color:var(--seal);border:1px dashed #E4C9C2;border-radius:2px}

/* 复盘 */
.review{padding:24px 20px 8px}
.score-row{display:flex;align-items:flex-end;gap:14px}
.bigscore{font:600 66px/1 var(--serif);color:var(--seal);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.bigscore small{font:400 11px var(--sans);color:var(--ink3)}
.score-side{padding-bottom:8px;font-size:11px;color:var(--ink3);line-height:1.8}
.cmt{font-size:13px;color:var(--ink2);line-height:2;margin:13px 0 2px}
.bars{margin-top:18px;display:flex;flex-direction:column;gap:13px}
.bar{display:grid;grid-template-columns:66px 1fr 42px;gap:11px;align-items:center}
.bar .muted{font-size:9px;letter-spacing:.14em}
.bar .track{height:2px;background:#EDE9E1}
.bar .fill{height:100%;background:var(--seal);transition:width .6s ease}
.bar .t-min{font:11.5px var(--serif);color:var(--ink2);text-align:right}

/* 旅程 */
.journey{padding:6px 0 0}
.jhead{display:flex;align-items:baseline;gap:10px;margin-bottom:2px}
.jhead .n{font:600 19px/1.3 var(--serif);font-variant-numeric:tabular-nums}
.jhead .u{font-size:10px;color:var(--ink3);letter-spacing:.1em}
.jhead .r{margin-left:auto;font-size:10.5px;color:var(--ink3)}
.jnote{font-size:11.5px;color:var(--ink2);margin:8px 0 0;line-height:1.8;letter-spacing:.02em}
.jnote b{color:var(--seal);font-weight:600}
svg.jroad{width:100%;height:auto;display:block;margin:6px 0 0;overflow:visible}
.road-bg{fill:none;stroke:#EAE4D8;stroke-width:7;stroke-linecap:round}
.road-fg{fill:none;stroke:#B23A2E;stroke-width:2.2;stroke-linecap:round;stroke-dasharray:0;opacity:.55}
.ms circle{fill:#FAF8F4;stroke:#D6CFC2;stroke-width:1.2}
.ms.reached circle{fill:#B23A2E;stroke:#B23A2E}
.ms.cur circle{stroke:#B23A2E;stroke-width:1.8;fill:#fff}
.ms text{font:9px var(--sans);fill:#9A948A;letter-spacing:.02em}
.ms.cur text{fill:#B23A2E;font-weight:600}
.ms.fin circle{r:6}
.ms.fin text{font:10px var(--serif);fill:#1A1917;font-weight:600}
.ghost{opacity:.34}
.ghost circle{fill:#5E5A52}
.ghost text{font:8px var(--sans);fill:#5E5A52}
.walker .body{stroke:#1A1917;stroke-width:2;stroke-linecap:round;fill:none}
.walker .head{fill:#1A1917}
.walker .leg{stroke:#1A1917;stroke-width:2;stroke-linecap:round}
.walker.limp .leg2{transform-origin:0 0}
.walker.hurt .crutch{stroke:#8A7A5C;stroke-width:1.6;stroke-linecap:round}
.walker.rest .body{stroke:#9A948A}
.walker .crutch{display:none}
.walker.hurt .crutch{display:inline}
.eta{margin:12px 0 6px;border-top:1px solid var(--line2);border-bottom:1px solid var(--line2);padding:9px 0}
.etarow{display:flex;align-items:baseline;gap:8px;padding:5px 0}
.etarow .l{color:var(--ink3);font-size:9px;letter-spacing:.14em;flex:0 0 54px}
.etarow .n{color:var(--ink2);font-size:12px;flex:1}
.etarow .v{font:600 13px var(--serif);color:var(--seal);font-variant-numeric:tabular-nums}
.etafoot{font-size:9px;color:var(--ink3);letter-spacing:.06em;margin-top:6px}
.jlegend{display:flex;gap:14px;flex-wrap:wrap;font-size:9.5px;color:var(--ink3);margin-top:10px;letter-spacing:.06em}
.jlegend i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px;vertical-align:1px}

/* 地图页/报告/设置 通用 */
.map{padding:20px 20px 10px}
.track{margin-bottom:22px}
.track h3{font:600 11px/1 var(--sans);letter-spacing:.2em;color:var(--ink3);margin:0 0 11px;display:flex;align-items:center;gap:8px}
.track h3::after{content:'';flex:1;height:1px;background:var(--line2)}
.station{border-left:1px solid var(--line);padding:0 0 16px 15px;position:relative}
.station::before{content:'';position:absolute;left:-4px;top:6px;width:7px;height:7px;border-radius:50%;background:var(--paper);border:1px solid #C9C2B6}
.station.cur::before{background:var(--seal);border-color:var(--seal);box-shadow:0 0 0 3px #F3E3DF}
.station.done::before{background:var(--ink);border-color:var(--ink)}
.station .st{font-size:13px;display:flex;gap:8px;align-items:baseline}
.station .st em{font-style:normal;font-size:9.5px;color:var(--ink3);letter-spacing:.08em}
.dots{display:flex;gap:3px;flex-wrap:wrap;margin-top:7px}
.dots i{width:8px;height:8px;border-radius:1px;background:#EDE9E1}
.dots i.on{background:var(--seal)}
.dots i.cur{background:#C29284}
.pct{font-size:10px;color:var(--ink3);margin-top:5px;letter-spacing:.06em}

.grid-cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:12px}
.grid-cal .dow{font-size:8.5px;color:var(--ink3);text-align:center;letter-spacing:.1em;padding-bottom:2px}
.cell{aspect-ratio:1;border-radius:2px;background:#F1EDE5;display:flex;flex-direction:column;align-items:center;
  justify-content:center;font-size:10.5px;color:var(--ink3);border:1px solid transparent;font-variant-numeric:tabular-nums}
.cell.has{color:#fff;font-weight:600;text-shadow:0 1px 2px rgba(0,0,0,.25)}
.cell.today{border-color:var(--seal)}
.cell .s{font-size:8px;opacity:.9}
.legend{display:flex;gap:4px;align-items:center;font-size:9px;color:var(--ink3);letter-spacing:.08em;margin-top:10px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}

.kpis{display:grid;grid-template-columns:1fr 1fr;margin:4px 0 18px}
.kpi{padding:9px 13px;border-left:1px solid var(--line)}
.kpi:nth-child(odd){border-left:0;padding-left:0}
.kpi .k{font-size:9px;letter-spacing:.16em;color:var(--ink3);margin-bottom:3px}
.kpi .v{font:600 23px/1.2 var(--serif);font-variant-numeric:tabular-nums}
.kpi .v small{font:400 9.5px var(--sans);color:var(--ink3)}
.weekbars{display:flex;gap:6px;align-items:flex-end;height:72px;margin:8px 0 2px}
.wb{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.wb .b{width:100%;background:#EDE9E1;border-radius:1px 1px 0 0;min-height:2px}
.wb .b.on{background:var(--seal)}

function pad(n){return String(n).padStart(2,'0');}
/* 学习日：凌晨 4 点换日。0:00–3:59 仍算前一天 */
function todayStr(d){
  var x=d?new Date(d):new Date();
  if(!d)x.setHours(x.getHours()-4);
  return x.getFullYear()+'-'+pad(x.getMonth()+1)+'-'+pad(x.getDate());
}
function dayCutoff(dstr){
  var c=parseD(dstr); c.setDate(c.getDate()+1); c.setHours(4,0,0,0); return c.getTime();
}
function parseD(s){return new Date(s+'T00:00:00');}
function shiftDate(s,n){var d=parseD(s);d.setDate(d.getDate()+n);return todayStr(d);}
var WEEK=['日','一','二','三','四','五','六'];
function multOf(lv){var i=LEVELS.indexOf(lv);return MULTS[i<0?7:i];}
function levelFromScore(p){return LEVELS[Math.max(0,Math.min(14,Math.floor(p/(100/15))))];}
function levelPct(lv){var i=LEVELS.indexOf(lv);return i<0?50:Math.round((i+0.5)*(100/15));}
function subjOf(id){for(var i=0;i<SUBJECTS.length;i++){if(SUBJECTS[i].id===id)return SUBJECTS[i];}return SUBJECTS[0];}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function clamp(x,a,b){return Math.max(a,Math.min(b,x));}

function defaultState(){
  return {version:3,curVersion:2,
    rating:{level:'B+',metrics:{videoSpeed:2.07,exMinPerProblem:10,noteRatio:1.07},detail:'基于 0108 实测',updatedAt:todayStr()},
    ratingHistory:[],settings:{dailyTarget:200},
    curriculum:JSON.parse(JSON.stringify(DEFAULT_CURRICULUM)),
    done:{},days:{},journey:{total:0,start:null,days:{}}};
}
var state;
try{
  var raw=localStorage.getItem(LS_KEY);
  state=raw?JSON.parse(raw):defaultState();
  if(!state.curriculum||!state.curriculum.chapters)state.curriculum=JSON.parse(JSON.stringify(DEFAULT_CURRICULUM));
  if((state.curVersion||1)<2){state.curriculum=JSON.parse(JSON.stringify(DEFAULT_CURRICULUM));state.curVersion=2;}
  if(!state.journey)state.journey={total:0,start:null,days:{}};
}catch(e){state=defaultState();}
function save(){
  state.updatedAt=Date.now();
  try{ localStorage.setItem(LS_KEY,JSON.stringify(state)); }catch(e){}
  try{ if(typeof scheduleSync==='function') scheduleSync(); }catch(e){}
}

/* 课程表外置在 curriculum.json：我改文件 → 版本号+1 → 手机刷新自动拉到新内容，
   打卡记录（done/days/journey）完全不受影响 */
/* ============ 云同步（私有仓库 rike-data） ============ */
var syncTimer=null, syncBusy=false, syncReady=false;
var SYNC_REPO='cuole-123/rike-data';
/* 内置共享令牌（只对 rike-data 有 Contents 读写权限），XOR 混淆，避免每台设备手填 */
var SYNC_TOKEN=(function(){
  try{
    var b='FQAfDVhQb0JXBjZaVG5mAngFNyhbV0VYBnNeFAwxBm9jb1lbRScIMEhDXUJjMRoZEXdjZlcARSoBAl0FUVRzOwwmN10Aal5BCDEhDH5oAnMDIltYM2lif0B4OQgx';
    var k='rike-2026', s=atob(b), o='';
    for(var i=0;i<s.length;i++)o+=String.fromCharCode(s.charCodeAt(i)^k.charCodeAt(i%k.length));
    return o;
  }catch(e){ return ''; }
})();
function syncCfg(){
  if(!state.settings)state.settings={};
  if(!state.settings.sync)state.settings.sync={token:SYNC_TOKEN,repo:SYNC_REPO,enabled:true,lastAt:0};
  var c=state.settings.sync;
  if(!c.repo)c.repo=SYNC_REPO;
  if(!c.token)c.token=SYNC_TOKEN;
  if(c.enabled===undefined)c.enabled=true;
  if(c.token===SYNC_TOKEN)c.enabled=true;   /* 内置令牌 = 默认开启共享 */
  return c;
}
function b64utf8(s){ return btoa(unescape(encodeURIComponent(s))); }
function scheduleSync(){
  var c=syncCfg();
  if(!c.enabled||!c.token||syncBusy||!syncReady)return;
  clearTimeout(syncTimer);
  syncTimer=setTimeout(function(){ syncUpload(true); },8000);
}
function syncUpload(silent){
  var c=syncCfg();
  if(!c.token||!c.repo){ if(!silent)toast('先填令牌'); return; }
  syncBusy=true;
  var body=JSON.stringify(state);
  var url='https://api.github.com/repos/'+c.repo+'/contents/state.json';
  var h={'Authorization':'Bearer '+c.token,'Accept':'application/vnd.github+json'};
  fetch(url,{headers:h})
    .then(function(r){ return r.ok?r.json():null; })
    .then(function(meta){
      var payload={message:'sync '+new Date().toISOString(),content:b64utf8(body),branch:'main'};
      if(meta&&meta.sha)payload.sha=meta.sha;
      return fetch(url,{method:'PUT',headers:h,body:JSON.stringify(payload)});
    })
    .then(function(r){
      if(r&&r.ok){
        c.lastAt=Date.now(); save();
        if(!silent)toast('已上传到云端');
        var el=document.getElementById('syncStat');
        if(el)el.textContent='上次上传 '+new Date(c.lastAt).toLocaleString();
      } else if(!silent){ toast('上传失败，检查令牌权限'); }
    })
    .catch(function(){ if(!silent)toast('上传失败，检查网络'); })
    .then(function(){ syncBusy=false; });
}
/* 合并云端：按天取较新的已提交版本，其余取并集，避免两台设备互相覆盖 */
function mergeRemote(remote){
  if(!remote||typeof remote!=='object')return false;
  var changed=false;
  state.days=state.days||{};
  Object.keys(remote.days||{}).forEach(function(d){
    var rd=remote.days[d], ld=state.days[d];
    if(!ld){ state.days[d]=rd; changed=true; return; }
    if(!rd)return;
    /* 计划：谁有内容用谁的 */
    if((!ld.plan||!ld.plan.length)&&rd.plan&&rd.plan.length){ ld.plan=rd.plan; changed=true; }
    /* 无论是否已盖章，都按任务逐项合并：勾选取并、替换取并、分钟取大、时间取新 */
    ld.items=ld.items||{};
    Object.keys(rd.items||{}).forEach(function(tid){
      var a=ld.items[tid], b=rd.items[tid];
      if(!a){ ld.items[tid]=b; changed=true; return; }
      if(b.done&&!a.done){a.done=true;changed=true;}
      if(b.replaced&&!a.replaced){a.replaced=true;if(b.customRef)a.customRef=b.customRef;changed=true;}
      if(b.advance===false)a.advance=false;
      else if(a.advance===undefined&&b.advance!==undefined)a.advance=b.advance;
      var bm=Number(b.minutes||0), am=Number(a.minutes||0);
      if(bm>am){a.minutes=b.minutes;changed=true;}
      if(b.at&&(!a.at||b.at>a.at)){a.at=b.at;changed=true;}
    });
    ld.extras=ld.extras||[];
    (rd.extras||[]).forEach(function(x){
      var dup=ld.extras.some(function(y){return y.ref===x.ref&&Number(y.minutes||0)===Number(x.minutes||0);});
      if(!dup){ld.extras.push(x);changed=true;}
    });
    /* 合并替换条目取并集，并把对应任务标成已合并，避免两台设备各显示一套 */
    ld.merges=ld.merges||[];
    (rd.merges||[]).forEach(function(m){
      if(!ld.merges.some(function(x){return x.id===m.id;})){
        ld.merges.push(m); changed=true;
      }
      (m.taskIds||[]).forEach(function(tid){
        var it=ld.items[tid]||{};
        if(!it.mergedId){it.mergedId=m.id;it.replaced=true;it.minutes=0;changed=true;}
      });
    });
    /* 任一边已盖章就视为已盖章，提交时间取更早的真实一次 */
    if(rd.submitted&&!ld.submitted){ld.submitted=true;ld.auto=rd.auto;changed=true;}
    if(rd.submittedAt&&(!ld.submittedAt||rd.submittedAt<ld.submittedAt)){ld.submittedAt=rd.submittedAt;changed=true;}
    /* 已盖章的按合并后的勾选重算，避免旧设备的 0 分覆盖真分数 */
    if(ld.submitted){
      var oldv=ld.score+'/'+ld.completion;
      var rr=scoreDay(ld);
      ld.score=rr.score; ld.completion=rr.completion;
      if(!ld.comment)ld.comment=commentFor(rr);
      if(oldv!==ld.score+'/'+ld.completion)changed=true;
    }
  });
  state.done=state.done||{};
  Object.keys(remote.done||{}).forEach(function(id){
    if(!state.done[id]){ state.done[id]=remote.done[id]; changed=true; }
  });
  state.journey=state.journey||{total:0,start:null,days:{}};
  state.journey.days=state.journey.days||{};
  if(remote.journey&&remote.journey.start&&!state.journey.start){state.journey.start=remote.journey.start;changed=true;}
  Object.keys((remote.journey&&remote.journey.days)||{}).forEach(function(d){
    var v=Number(remote.journey.days[d])||0;
    if(v>(Number(state.journey.days[d])||0)){state.journey.days[d]=v;changed=true;}
  });
  if(remote.rating&&(!state.rating||(remote.rating.updatedAt||'')>(state.rating.updatedAt||''))){
    state.rating=remote.rating; changed=true;
  }
  if(remote.curriculum&&remote.curriculum.chapters&&(remote.curriculum.version||0)>(state.curVersion||0)){
    state.curriculum=remote.curriculum; state.curVersion=remote.curriculum.version; changed=true;
  }
  return changed;
}
function syncPullSilent(quiet){
  var c=syncCfg();
  if(!c.enabled||!c.token||!c.repo){ syncReady=true; return; }
  if(syncBusy){ syncReady=true; return; }
  syncBusy=true;
  var url='https://api.github.com/repos/'+c.repo+'/contents/state.json';

function taskById(id){for(var i=0;i<state.curriculum.chapters.length;i++){var ch=state.curriculum.chapters[i];
  for(var j=0;j<ch.tasks.length;j++){if(ch.tasks[j].id===id)return ch.tasks[j];}}return null;}
function chapterOfTask(id){for(var i=0;i<state.curriculum.chapters.length;i++){var ch=state.curriculum.chapters[i];
  for(var j=0;j<ch.tasks.length;j++){if(ch.tasks[j].id===id)return ch;}}return null;}
function isDone(id){return !!state.done[id];}
function estMin(t){return Math.max(5,Math.round(t.baseMin*multOf(state.rating.level)));}

/* ============ 计划 ============ */
var SUBJ_WEIGHT={sf:0.56,gd:0.28,en:0.16};   /* 单词 16%，其余 84% 按 数分:高代 = 2:1 */

function generatePlan(){
  var target=state.settings.dailyTarget||180;
  var pool={};
  state.curriculum.chapters.forEach(function(ch){
    ch.tasks.forEach(function(t,i){
      if(isDone(t.id))return;
      if(!pool[ch.subject])pool[ch.subject]=[];
      pool[ch.subject].push({ch:ch,t:t,i:i});
    });
  });

  var picked=[];
  ['sf','gd','en'].forEach(function(sid){
    var list=pool[sid]||[];
    var budget=Math.round(target*(SUBJ_WEIGHT[sid]||0));
    var sum=0;
    for(var k=0;k<list.length;k++){
      if(sum>=budget)break;
      picked.push(list[k]); sum+=estMin(list[k].t);
    }
  });

  /* 某科目没内容时，把余量补给别人 */
  var total=picked.reduce(function(s,p){return s+estMin(p.t);},0);
  if(total<target){
    var rest=[];
    Object.keys(pool).forEach(function(sid){
      pool[sid].forEach(function(p){ if(picked.indexOf(p)<0)rest.push(p); });
    });
    for(var j=0;j<rest.length;j++){
      if(total>=target)break;
      picked.push(rest[j]); total+=estMin(rest[j].t);
    }
  }

  var ord={sf:0,gd:1,en:2};
  picked.sort(function(a,b){return (ord[a.ch.subject]-ord[b.ch.subject])||(a.ch.id===b.ch.id?a.i-b.i:0);});
  return picked.map(function(p){return p.t.id;});
}
/* 提前做：从计划之外的任务里取 3 项，完成即推进度（但不是今天必须做的） */
function bonusFor(dstr,planIds){
  var inPlan={};
  (planIds||[]).forEach(function(id){inPlan[id]=1;});
  var out=[];
  state.curriculum.chapters.forEach(function(ch){
    ch.tasks.forEach(function(t){
      if(out.length>=3)return;
      if(inPlan[t.id])return;
      if(isDone(t.id))return;
      out.push({id:t.id,ref:t.ref,minutes:estMin(t),subject:ch.subject,done:false});
    });
  });
  return out;
}

function ensureDay(dstr){
  if(!state.days[dstr]){state.days[dstr]={plan:dstr===todayStr()?generatePlan():[],items:{},extras:[],submitted:false};save();}
  if(!state.days[dstr].extras)state.days[dstr].extras=[];
  if(!state.days[dstr].bonus)state.days[dstr].bonus=bonusFor(dstr,state.days[dstr].plan);
  return state.days[dstr];
}

/* ============ 评分 ============ */
function scoreDay(day){
  var planBase=0,doneBase=0,planEst=0,actual=0,doneCount=0,doneEst=0;
  var repMin=0, planCount=0;
  day.plan.forEach(function(id){
    var t=taskById(id);if(!t)return;
    var it=day.items[id]||{}, e=estMin(t);
    if(it.replaced){ repMin+=Number(it.minutes||e); return; }   /* 替换：不计入今日计划 */
    planBase+=t.baseMin;planEst+=e;planCount++;
    if(it.done){doneBase+=t.baseMin;doneCount++;doneEst+=e;actual+=Number(it.minutes||e);}
  });
  var completion=planBase?doneBase/planBase:0, eff=0;
  if(doneCount&&actual>0){eff=clamp(doneEst/actual/1.15,0,1);}
  (day.merges||[]).forEach(function(m){repMin+=Number(m.minutes||0);});
  var exMin=repMin;
  (day.extras||[]).forEach(function(x){exMin+=Number(x.minutes||0);});
  var bnMin=0;
  Object.keys(day.items).forEach(function(id){
    var it=day.items[id];
    if(it&&it.early&&it.done)bnMin+=Number(it.minutes||0);
  });
  var base=Math.round(100*(0.8*completion+0.2*eff));
  var bonus=Math.min(8,Math.round((exMin+bnMin)/20));
  return {score:Math.min(100,base+bonus),base:base,bonus:bonus,completion:completion,eff:eff,
          planEst:planEst,actual:actual+exMin+bnMin,doneCount:doneCount,planCount:planCount,
          extrasMin:exMin,repMin:repMin,bonusMin:bnMin};
}
function commentFor(r){
  var c=Math.round(r.completion*100), fast=r.actual>0&&r.planEst>0&&r.actual<=r.planEst, a=[];
  if(c===100)a.push(fast?'全部完成，而且比预估更快。':'全部完成，节奏稳。');
  else if(c>=75)a.push('完成 '+c+'%，主线推进正常，差一点收尾。');
  else if(c>=45)a.push('完成 '+c+'%，一半。明天先把尾巴补上。');
  else if(c>0)a.push('完成 '+c+'%，今天掉队了。');
  else a.push('一项都没勾。若确实没学，明天从最小的一项重启。');
  if(c>=75&&fast)a.push('按这速度，评级上调有戏。');
  if(c>=75&&!fast)a.push('时间超了，预估偏乐观，周评会调系数。');
  if(c<75&&fast)a.push('做得快但没做完，注意别把时间花在计划外。');
  return a.join('');
}

/* ============ 旅程计算 ============ */
function stepsFor(r){
  var cr=r.completion;
  var sp=0.85+0.3*(r.score/100);          /* 0.85 ~ 1.15 */
  var base=r.doneCount?Math.round(BENCH_PER_DAY*cr*sp):0;
  var extra=Math.round(((r.extrasMin||0)+(r.bonusMin||0))*0.6);   /* 加餐与额外任务计步 */
  return Math.max(0,base+extra);
}
function buffFor(r){
  if(!r.doneCount)return {cls:'rest',text:'原地坐下休息，一步没走'};
  var c=r.completion*100;
  if(c>=100&&r.score>=88)return {cls:'brisk',text:'脚下生风，一路小跑'};
  if(c>=85)return {cls:'walk',text:'步伐稳健'};
  if(c>=60)return {cls:'limp',text:'有点一瘸一拐——今天慢了半拍'};
  if(c>=30)return {cls:'hurt',text:'拄着拐走：只走了小半程'};
  return {cls:'hurt',text:'几乎是拖着腿挪了几步'};
}
function journeyTotal(){
  var sum=0;
  Object.keys(state.journey.days||{}).forEach(function(d){sum+=state.journey.days[d]||0;});
  return sum;
}
function benchTotal(){
  if(!state.journey.start)return 0;
  var a=parseD(state.journey.start), b=parseD(todayStr());
  var days=Math.max(1,Math.round((b-a)/86400000)+1);
  return days*BENCH_PER_DAY;
}

/* 过了 4:00 还没盖章的日子，自动按已勾选的提交 */
function autoCloseOverdue(){
  var now=Date.now(), changed=false;
  Object.keys(state.days).forEach(function(d){
    var day=state.days[d];
    if(!day||day.submitted)return;
    if(now<dayCutoff(d))return;

    var r=scoreDay(day);
    day.score=r.score;
    day.completion=r.completion;
    day.comment=commentFor(r)+(r.doneCount?'':'（4:00 自动结算：一项都没勾）');
    day.submitted=true;
    day.auto=true;
    day.submittedAt=new Date().toISOString();
    day.plan.forEach(function(id){
      var it=day.items[id]||{};
      if(it.done||(it.replaced&&it.advance!==false))state.done[id]=d;
      else if(state.done[id]===d)delete state.done[id];
    });
    var st=stepsFor(r);
    if(st>0&&state.journey)state.journey.days[d]=st;
    changed=true;
  });
  if(changed)save();
}

function poemFor(dstr){
  var seed=0;for(var i=0;i<dstr.length;i++)seed+=dstr.charCodeAt(i)*7+i*13;
  return POEMS[Math.abs(seed)%POEMS.length];
}

function ashBurst(rect){
  var cv=document.getElementById('ashcanvas');
  if(!cv||!rect)return;
  var dpr=Math.min(2,window.devicePixelRatio||1);
  var W=window.innerWidth, H=window.innerHeight;
  cv.width=W*dpr; cv.height=H*dpr;
  cv.style.width=W+'px'; cv.style.height=H+'px';
  cv.style.display='block';
  var ctx=cv.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);

  var ps=[];
  var n=Math.max(130,Math.min(340,Math.round(rect.width/1.55)));   /* 灰要多 */
  var palette=['#4A463F','#6E6A62','#8F8A80','#B7B1A6','#D8D3C9'];
  for(var i=0;i<n;i++){
    var big=(Math.random()<0.08);
    ps.push({
      x:rect.left+Math.random()*rect.width,
      y:rect.top+Math.random()*rect.height,
      vx:-(0.5+Math.random()*2.8),          /* 主风向：左 */
      vy:-(0.05+Math.random()*1.15),
      s:big?(3.0+Math.random()*2.6):(0.7+Math.random()*2.1),
      life:0,
      max:720+Math.random()*880,            /* 飘更久 */
      col:(Math.random()<0.11?'#B23A2E':palette[(Math.random()*palette.length)|0]),
      rot:Math.random()*Math.PI,
      vr:(Math.random()-0.5)*0.14,
      seed:Math.random()*100,
      base:0.45+Math.random()*0.5
    });
  }
  var last=performance.now();
  cancelAnimationFrame(ashRAF);
  function frame(t){
    var dt=Math.min(34,t-last); last=t;
    ctx.clearRect(0,0,W,H);
    var alive=0;
    for(var i=0;i<ps.length;i++){
      var p=ps[i];
      p.life+=dt;
      if(p.life>p.max)continue;
      p.vy+=0.011*(dt/16);                          /* 灰几乎不坠 */
      p.vx-=0.009*(dt/16);                          /* 持续左风 */
      p.vx+=Math.sin((p.y+p.seed)/26)*0.04*(dt/16); /* 湍流：忽快忽慢 */
      p.vy+=Math.cos((p.x+p.seed)/30)*0.02*(dt/16);
      p.vx*=0.996; p.vy*=0.996;
      p.x+=p.vx*(dt/16);
      p.y+=p.vy*(dt/16);
      p.rot+=p.vr*(dt/16);
      var k=1-p.life/p.max;
      ctx.save();
      ctx.globalAlpha=Math.max(0,Math.pow(k,0.9)*p.base);
      ctx.fillStyle=p.col;
      ctx.translate(p.x,p.y);
      ctx.rotate(p.rot);
      ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*0.85);
      ctx.restore();
      alive++;
    }
    if(alive>0){ashRAF=requestAnimationFrame(frame);}
    else{ctx.clearRect(0,0,W,H);cv.style.display='none';}
  }
  ashRAF=requestAnimationFrame(frame);
}

function attachSwipe(li,id){
  var sx=0,dx=0,active=false;
  li.addEventListener('pointerdown',function(e){
    if(e.target.closest('.form')||e.target.closest('.linkbtn')||e.target.closest('input'))return;
    active=true;sx=e.clientX;dx=0;li.style.transition='none';
    li.classList.add('dragging');
    try{li.setPointerCapture(e.pointerId);}catch(err){}
  });
  li.addEventListener('pointermove',function(e){
    if(!active)return;
    dx=Math.min(0,e.clientX-sx);
    li.style.transform='translateX('+dx+'px)';
    li.style.background=dx<-16?'#F6F1E7':'';
    var rv=li.querySelector('.swact');
    if(rv)rv.style.opacity=Math.min(1,(-dx)/64);
    if(dx<-78&&!li._vib){li._vib=true;try{navigator.vibrate&&navigator.vibrate(12);}catch(err){}}
    if(dx>-56)li._vib=false;
  });
  li.addEventListener('pointerup',function(){
    if(!active)return;active=false;
    if(dx<-78){
      try{navigator.vibrate&&navigator.vibrate([8,18,8]);}catch(err){}
      li.style.transform='translateX(0)';
      li.classList.remove('dragging');
      var rect=li.getBoundingClientRect();
      ashBurst(rect);
      li.classList.add('burning');
      setTimeout(function(){
        li.style.height=rect.height+'px';
        li.classList.add('collapsing');
        void li.offsetHeight;
        li.style.height='0px';
        setTimeout(function(){openComplete(id);},340);
      },340);
    }else{
      li.style.transition='transform .32s cubic-bezier(.2,.9,.3,1.25)';
      li.style.transform='translateX(0)';
      li.style.background='var(--paper)';
      li.classList.remove('dragging');
    }
  });
  li.addEventListener('pointercancel',function(){active=false;li.style.transform='translateX(0)';li.style.background='var(--paper)';});
}

function confirmComplete(){
  var id=pendingComplete;if(!id)return;
  var day=state.days[curDate];if(!day)return;
  var mins=Number(document.getElementById('mMin').value)||0;
  var inPlan=day.plan.indexOf(id)>=0;

  day.items[id].minutes=mins;

  if(!inPlan){
    day.items[id].early=true;

    }catch(e){}

  pendingComplete=null;

function undoLast(){
  var day=state.days[curDate];if(!day)return;
  var lastId=null,lastAt=-1;
  Object.keys(day.items).forEach(function(id){
    var it=day.items[id];
    if(it&&it.done&&(it.at||0)>lastAt){lastAt=it.at||0;lastId=id;}
  });
  if(!lastId){toast('没有可撤销的');return;}
  var it=day.items[lastId];
  it.done=false;delete it.at;
  if(it.early){delete it.early;delete state.done[lastId];}  /* 提前做的撤销，进度也退回 */
  save();renderSheet();toast('已撤销一项');
}

function bindSheet(){
  var day=state.days[curDate];if(!day)return;
  if(multiSel.on){
    Array.prototype.forEach.call(document.querySelectorAll('[data-msel]'),function(el){
      el.onclick=function(e){
        e.preventDefault();
        var id=el.getAttribute('data-msel');
        if(multiSel.ids[id])delete multiSel.ids[id]; else multiSel.ids[id]=true;
        renderSheet();
      };
    });
    var mb=document.getElementById('mergeBtn');
    if(mb)mb.onclick=openMerge;
    var mc=document.getElementById('mergeCancel');
    if(mc)mc.onclick=function(){multiSel={on:false,ids:{},date:curDate};renderSheet();};
    return;
  }
  Array.prototype.forEach.call(document.querySelectorAll('li.task.sw'),function(el){
    attachSwipe(el,el.getAttribute('data-id'));
  });
  var ub=document.getElementById('undoBtn');
  if(ub)ub.onclick=function(){undoLast();};
  Array.prototype.forEach.call(document.querySelectorAll('[data-bn]'),function(el){
    el.onclick=function(){openComplete(el.getAttribute('data-bn'));};
  });
  Array.prototype.forEach.call(document.querySelectorAll('.meter input'),function(el){
    el.onchange=function(ev){
      var id=ev.target.getAttribute('data-min');
      day.items[id]=day.items[id]||{};
      day.items[id].minutes=Number(ev.target.value)||0;
      save();refreshSum();
    };
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-rep]'),function(el){
    el.onclick=function(){openEdit(el.getAttribute('data-rep'),'replace');};
  });

  Array.prototype.forEach.call(document.querySelectorAll('[data-unrep]'),function(el){
    el.onclick=function(){
      var id=el.getAttribute('data-unrep');
      var it=day.items[id]||{};
      delete it.replaced; delete it.customRef; delete it.advance; it.done=false;
      if(state.done[id]===curDate)delete state.done[id];
      save();renderSheet();toast('已恢复原任务');
    };
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-exdel]'),function(el){
    el.onclick=function(){
      var i=Number(el.getAttribute('data-exdel'));
      day.extras.splice(i,1);save();renderSheet();
    };
  });
  var ab=document.getElementById('addExtraBtn');
  if(ab)ab.onclick=function(){openEdit(null,'extra');};
  var mt=document.getElementById('mergeToggle');
  if(mt)mt.onclick=function(){multiSel={on:true,ids:{},date:curDate};renderSheet();};
  Array.prototype.forEach.call(document.querySelectorAll('[data-mgdel]'),function(el){
    el.onclick=function(){
      var mid=el.getAttribute('data-mgdel');
      var m=(day.merges||[]).filter(function(x){return x.id===mid;})[0];
      if(!m)return;
      m.taskIds.forEach(function(tid){
        var it=day.items[tid]||{};
        delete it.replaced;delete it.mergedId;delete it.customRef;delete it.advance;
        if(state.done[tid]===curDate)delete state.done[tid];
      });
      day.merges=day.merges.filter(function(x){return x.id!==mid;});
      save();renderSheet();toast('已取消合并');
    };
  });

  var sb=document.getElementById('submitBtn');
  if(sb)sb.onclick=doSubmit;
}
function refreshSum(){
  var day=state.days[curDate];if(!day)return;
  var doneN=0,act=0;
  day.plan.forEach(function(id){var it=day.items[id]||{};if(it.done){doneN++;act+=Number(it.minutes||0);}});
  var a=document.getElementById('sumDone'),b=document.getElementById('sumAct');

function doSubmit(){
  var day=state.days[curDate];if(!day)return;
  var r=scoreDay(day);
  if(r.doneCount===0&&!confirm('一项都没勾，确定提交吗？'))return;

  var prevTotal=journeyTotal();
  if(!state.journey.start&&r.doneCount)state.journey.start=curDate;
  var steps=stepsFor(r);
  state.journey.days[curDate]=steps;

  day.score=r.score;day.completion=r.completion;day.comment=commentFor(r);
  day.submitted=true;day.submittedAt=new Date().toISOString();
  day.plan.forEach(function(id){
    var it=day.items[id]||{};
    if(it.done||(it.replaced&&it.advance!==false))state.done[id]=curDate;
    else if(state.done[id]===curDate)delete state.done[id];
  });
  save();
  stamp(r.score);
  setTimeout(function(){renderSheet();},520);
}

/* ---------- 旅程 SVG ---------- */
function roadGeom(w,h){
  var segs=7, d='M '+(w/2)+' '+(h-8);
  for(var i=1;i<=segs;i++){
    var t=i/segs, y=h-8-(h-30)*t;
    var x=w/2+Math.sin(t*Math.PI*1.7)*w*0.16;
    var cy=h-8-(h-30)*((i-0.5)/segs);
    var cx=w/2+Math.sin((t-0.5/segs)*Math.PI*1.7)*w*0.26;
    d+=' Q '+cx.toFixed(1)+' '+cy.toFixed(1)+' '+x.toFixed(1)+' '+y.toFixed(1);
  }
  return d;
}

function walkerSvg(){

    '<path class="leg leg2" d="M0 -2 L3.4 6"/>'+
    '<path class="body" d="M0 -8 L-3.4 -3"/>'+
    '<path class="crutch" d="M4.6 -11 L5.6 7"/>'+
    '</g>';
}

function journeyPace(){
  var days=Object.keys(state.journey.days||{});
  if(!days.length)return 0;
  days.sort();
  var recent=days.slice(-7).map(function(d){return state.journey.days[d]||0;})
                         .filter(function(v){return v>0;});
  if(!recent.length)return 0;
  var s=0; recent.forEach(function(v){s+=v;});
  return s/recent.length;
}
function etaDays(total,target,pace){
  if(pace<=0)return null;
  return Math.ceil(Math.max(0,target-total)/pace);
}
function etaHtml(){
  var total=journeyTotal(), pace=journeyPace();
  var step=TOTAL_STEPS/(MILESTONES.length-1);
  var idx=Math.min(MILESTONES.length-1,Math.floor(total/step));
  var nextIdx=Math.min(MILESTONES.length-1,idx+1);
  var nextStep=step*nextIdx;
  var stages=[3,7,10,11], st=null;
  for(var i=0;i<stages.length;i++){ if(step*stages[i]>total){ st=stages[i]; break; } }

  function row(label,days,name){
    var v;
    if(pace<=0)v='—';
    else if(days==null)v='—';
    else if(days<=0)v='已到';
    else v=days+' 天';
    return '<div class="etarow"><span class="l">'+label+'</span>'+
           '<span class="n">'+esc(name)+'</span>'+
           '<span class="v">'+v+'</span></div>';
  }
  var a=etaDays(total,nextStep,pace);
  var b=(st!=null)?etaDays(total,step*st,pace):0;
  var c=etaDays(total,TOTAL_STEPS,pace);
  return '<div class="eta">'+
    row('下一节点',a,MILESTONES[nextIdx])+
    row('下一阶段',b,(st!=null)?MILESTONES[st]:'南开')+
    row('终点',c,'南开')+
    '<div class="etafoot">按最近 7 天日均 '+Math.round(pace)+' 步推算</div>'+
  '</div>';
}

function renderJourney(animateFrom){
  var total=journeyTotal(), bench=benchTotal();
  var w=300,h=330;
  var d=roadGeom(w,h);
  var pos=clamp(total/TOTAL_STEPS,0,1);
  var bpos=clamp(bench/TOTAL_STEPS,0,1);

  var ms='';
  MILESTONES.forEach(function(name,i){
    var t=i/(MILESTONES.length-1);
    var x=w/2+Math.sin(t*Math.PI*1.7)*w*0.16;
    var y=h-8-(h-30)*t;
    var reached=(i/(MILESTONES.length-1))<=pos;
    var isCur=(i===Math.min(MILESTONES.length-1,Math.floor(pos*(MILESTONES.length-1)+0.001)));
    ms+='<g class="ms '+(reached?'reached':'')+' '+(isCur?'cur':'')+' '+(i===MILESTONES.length-1?'fin':'')+'">'+
      '<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="'+(i===MILESTONES.length-1?5:3)+'"/>'+
      '<text x="'+(x+9).toFixed(1)+'" y="'+(y+3).toFixed(1)+'">'+esc(name)+'</text></g>';
  });

  return '<div class="journey">'+
    '<div class="jhead"><span class="n">'+total+'</span><span class="u">步</span>'+
      '<span class="r">全程 '+TOTAL_STEPS+' 步 · '+Math.round(pos*100)+'%</span></div>'+

function placeOnPath(svg, idOrEl, ratio){
  var path=svg.querySelector('.road-bg');
  var el=(typeof idOrEl==='string')?svg.querySelector('#'+idOrEl):idOrEl;
  if(!path||!el||!path.getTotalLength)return;
  var len=path.getTotalLength();
  var pt=path.getPointAtLength(len*clamp(ratio,0,1));
  el.setAttribute('transform','translate('+pt.x.toFixed(2)+','+pt.y.toFixed(2)+')');
}

function animateJourney(container, fromRatio, toRatio, buff, cb){
  var svg=container.querySelector('svg.jroad');if(!svg)return;
  var walker=svg.querySelector('#walkerG');
  if(!walker)return;
  var ghost=svg.querySelector('#ghostM');
  var bench=benchTotal();
  if(ghost){placeOnPath(svg,ghost,bench/TOTAL_STEPS);
    var gp=svg.querySelector('.road-bg');
    if(gp&&gp.getTotalLength){var l=gp.getTotalLength();var pt=gp.getPointAtLength(l*clamp(bench/TOTAL_STEPS,0,1));
      var c=ghost.querySelector('circle');if(c){c.setAttribute('cx',0);c.setAttribute('cy',0);}
      ghost.setAttribute('transform','translate('+pt.x.toFixed(2)+','+pt.y.toFixed(2)+')');}
  }

  walker.setAttribute('class','walker-holder');
  var g=walker.querySelector('.walker');
  if(g){g.setAttribute('class','walker '+buff.cls);}

  var path=svg.querySelector('.road-bg');
  var len=(path&&path.getTotalLength)?path.getTotalLength():0;
  var dur = buff.cls==='brisk'?900 : buff.cls==='walk'?1300 : buff.cls==='limp'?1900 : buff.cls==='hurt'?2600 : 1200;
  var t0=null;
  function frame(ts){
    if(t0===null)t0=ts;
    var k=Math.min(1,(ts-t0)/dur);
    var e=1-Math.pow(1-k,3);
    var ratio=fromRatio+(toRatio-fromRatio)*e;
    if(len){
      var pt=path.getPointAtLength(len*clamp(ratio,0,1));
      var bob=Math.sin(k*Math.PI*8)*(buff.cls==='hurt'?1.7:buff.cls==='limp'?1.2:0.8);
      var tilt=0;
      if(buff.cls==='limp')tilt=Math.sin(k*Math.PI*8)*7;
      else if(buff.cls==='hurt')tilt=Math.sin(k*Math.PI*6)*4;
      walker.setAttribute('transform','translate('+pt.x.toFixed(2)+','+pt.y.toFixed(2)+') rotate('+tilt.toFixed(1)+') translate(0,'+bob.toFixed(2)+')');
    }
    if(k<1)requestAnimationFrame(frame);
    else if(cb)cb();
  }
  requestAnimationFrame(frame);
}

function renderMap(){
  try{

    var totalAll=0,doneAll=0,tracks={};
    chapters.forEach(function(ch){
      if(!tracks[ch.subject])tracks[ch.subject]=[];

var dailyManifest=null;

function inlineMd(s){
  return esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
}
function mdToHtml(md){
  var lines=String(md).split('\n'), out=[], inList=false;
  function closeList(){ if(inList){out.push('</ul>');inList=false;} }
  lines.forEach(function(raw){
    var l=raw.replace(/\s+$/,'');
    var t=l.trim();
    if(!t){ closeList(); return; }
    if(t.indexOf('# ' )===0){ closeList(); out.push('<h2>'+inlineMd(t.slice(2))+'</h2>'); return; }
    if(t.indexOf('## ')===0){ closeList(); out.push('<h3>'+inlineMd(t.slice(3))+'</h3>'); return; }
    if(t.indexOf('### ')===0){ closeList(); out.push('<h3>'+inlineMd(t.slice(4))+'</h3>'); return; }
    if(t.indexOf('- ')===0){ if(!inList){out.push('<ul>');inList=true;} out.push('<li>'+inlineMd(t.slice(2))+'</li>'); return; }
    closeList();
    out.push('<p>'+inlineMd(t)+'</p>');
  });
  closeList();
  return out.join('\n');
}

function agg(list){
  var n=0,sum=0,comp=0,mins=0,pc=0,dc=0,by={};
  list.forEach(function(pair){
    var v=pair[1];if(!v.submitted)return;
    n++;sum+=(v.score||0);comp+=(v.completion||0);
    v.plan.forEach(function(id){
      var t=taskById(id);if(!t)return;
      pc++;
      var it=v.items[id]||{};
      mins+=Number(it.minutes||0);
      if(it.done){dc++;var ch=chapterOfTask(id);if(ch)by[ch.subject]=(by[ch.subject]||0)+Number(it.minutes||0);}
    });
  });
  return {days:n,avg:n?Math.round(sum/n):0,comp:n?Math.round(comp/n*100):0,mins:mins,pc:pc,dc:dc,by:by};
}

      }catch(e){toast('JSON 有误：'+e.message);}
    };
    document.getElementById('curReset').onclick=function(){
      state.curriculum=JSON.parse(JSON.stringify(DEFAULT_CURRICULUM));
      delete state.days[todayStr()];save();renderSettings();toast('已恢复默认');
    };
    document.getElementById('syncSave').onclick=function(){
      var c=syncCfg();
      c.token=(document.getElementById('tokIn').value||'').trim();
      c.repo=(document.getElementById('repoIn').value||'cuole-123/rike-data').trim();
      c.enabled=document.getElementById('syncOn').checked;
      save(); toast('已保存');
    };
    document.getElementById('syncNow').onclick=function(){ syncUpload(false); };
    document.getElementById('syncPull').onclick=syncPull;

    document.getElementById('expBtn').onclick=function(){
      var blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
      var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='rike-'+todayStr()+'.json';a.click();
    };
    document.getElementById('impBtn').onclick=function(){
      var inp=document.createElement('input');inp.type='file';inp.accept='.json';
      inp.onchange=function(ev){
        var f=ev.target.files[0];if(!f)return;
        var rd=new FileReader();
        rd.onload=function(){try{state=JSON.parse(rd.result);save();location.reload();}catch(e){toast('解析失败');}};
        rd.readAsText(f);
      };inp.click();
    };
    document.getElementById('clrBtn').onclick=function(){
      if(!confirm('清空所有打卡与旅程？不可撤销。'))return;
      var cur=state.curriculum;state=defaultState();state.curriculum=cur;save();location.reload();
    };
  }catch(e){document.getElementById('settings').innerHTML='<div class="err">设置页出错：'+esc(e.message)+'</div>';}
}

/* ============ 评级 ============ */
function computeRating(){
  var entries=Object.keys(state.days).map(function(d){return [d,state.days[d]];})
    .filter(function(p){return p[1].submitted&&p[1].plan.length;});
  if(!entries.length)return null;
  var cut=shiftDate(todayStr(),-14);
  var vidTotal=0,vidSpent=0,exBase=0,exSpent=0,noteBase=0,noteSpent=0;
  entries.forEach(function(p){
    var d=p[0],v=p[1];if(d<cut)return;
    v.plan.forEach(function(id){
      var t=taskById(id);if(!t)return;
      var it=v.items[id]||{};if(!it.done)return;
      var mins=Number(it.minutes||estMin(t));
      if(t.type==='video'&&t.vidMin){vidTotal+=t.vidMin;vidSpent+=mins;}
      else if(t.type==='exercise'&&t.count){exBase+=t.baseMin;exSpent+=mins;}
      else if(t.type==='note'){noteBase+=t.baseMin;noteSpent+=mins;}
    });
  });
  var vs=vidSpent>0?vidTotal/vidSpent:0;
  var rv=vs>0?vs/1.5:null, re=exSpent>0?exBase/exSpent:null, rn=noteSpent>0?noteBase/noteSpent:null;
  var ls=0,ws=0;
  if(rv){ls+=Math.log2(rv)*0.35;ws+=0.35;}
  if(re){ls+=Math.log2(re)*0.40;ws+=0.40;}
  if(rn){ls+=Math.log2(rn)*0.25;ws+=0.25;}
  if(!ws)return null;
  var composite=clamp(50+25*(ls/ws),0,100);
  return {level:levelFromScore(composite),composite:Math.round(composite),
    metrics:{videoSpeed:+vs.toFixed(2),exMinPerProblem:exSpent>0?+(exSpent/Math.max(1,Math.round(exBase/14))).toFixed(1):0,
             noteRatio:noteSpent>0?+(noteSpent/noteBase).toFixed(2):0},
    samples:{days:entries.filter(function(p){return p[0]>=cut;}).length}};
}
function applyRating(r){
  state.rating={level:r.level,metrics:r.metrics,detail:'综合 '+r.composite+' · 样本 '+r.samples.days+' 天',updatedAt:todayStr()};
  state.ratingHistory.push({date:todayStr(),level:r.level,composite:r.composite});
  save();renderHeader();renderSettings();toast('已重新评级：'+r.level);
}
function renderHeader(){
  var lv=state.rating.level,m=state.rating.metrics||{},bits=[];
  document.getElementById('seal').textContent=lv;
  document.getElementById('lv-label').textContent=lv;
  if(m.videoSpeed)bits.push('视频 '+m.videoSpeed+'×');
  if(m.exMinPerProblem)bits.push('题 '+m.exMinPerProblem+'分');
  document.getElementById('lv-detail').textContent=bits.join(' · ')||('超过 '+levelPct(lv)+'%');
}
function toast(msg){
  var t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('on');
  clearTimeout(t._h);t._h=setTimeout(function(){t.classList.remove('on');},1800);
}

/* ============ 导航 ============ */
Array.prototype.forEach.call(document.querySelectorAll('.tabbar button'),function(btn){
  btn.onclick=function(){
    Array.prototype.forEach.call(document.querySelectorAll('.tabbar button'),function(b){b.classList.remove('on');});
    btn.classList.add('on');
    var v=btn.getAttribute('data-view');
    ['sheet','map','daily','report','settings'].forEach(function(x){
      document.getElementById('view-'+x).classList.toggle('hidden',x!==v);
    });
    if(v==='map')renderMap();
    if(v==='daily')renderDaily();
    if(v==='report')renderReport();
    if(v==='settings')renderSettings();
    window.scrollTo({top:0,behavior:'smooth'});
  };
});

/* 滑动翻页 */
(function(){
  var x0=null,y0=null,el=document.getElementById('view-sheet');
  el.addEventListener('touchstart',function(e){
    if(e.touches.length!==1)return;x0=e.touches[0].clientX;y0=e.touches[0].clientY;
  },{passive:true});
  el.addEventListener('touchend',function(e){
    if(x0==null)return;
    var dx=e.changedTouches[0].clientX-x0, dy=e.changedTouches[0].clientY-y0;
    if(Math.abs(dx)>64&&Math.abs(dy)<48){
      var next=shiftDate(curDate,dx>0?-1:1);
      if(next<=todayStr()){curDate=next;renderSheet();}
    }
    x0=null;y0=null;
  },{passive:true});
})();

document.getElementById('mOk').onclick=confirmComplete;
document.getElementById('mCancel').onclick=closeComplete;
document.getElementById('modal').addEventListener('click',function(e){
  if(e.target===document.getElementById('modal'))closeComplete();
});

/* 启动 */
autoCloseOverdue();
renderHeader();
ensureDay(todayStr());
renderSheet();
syncCurriculum();
syncPullSilent();
/* 另一台设备改了数据：回到页面或每 2 分钟自动合并一次 */
setInterval(function(){ if(!document.hidden)syncPullSilent(true); },120000);
document.addEventListener('visibilitychange',function(){ if(!document.hidden)syncPullSilent(true); });
setInterval(function(){
  autoCloseOverdue();
  var d=todayStr();
  if(d!==curDate){curDate=d;renderSheet();}
},60000);
</script>
